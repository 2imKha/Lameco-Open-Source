name: MLOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install libgl1 for cv2
        sudo apt-get update && sudo apt-get install -y libgl1
        
    - name: Verify Data Structure
      run: |
        ls -R yolo_training/dataset_v2/
        
    - name: Train YOLO Model
      # Runs the training script using the existing dataset structure
      run: |
        python src/train.py \
          --screenshots_dir "yolo_training/dataset_v2/images" \
          --label_studio_export "yolo_training/dataset_v2" \
          --out_dir "data/processed/dataset_prepared" \
          --imgs_sz 640 \
          --model_size n \
          --overwrite
          
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: |
          runs_logo/y11_logo/weights/best.pt
          logo.yaml
          data/processed/dataset_prepared/matches.csv
